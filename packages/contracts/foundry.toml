[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
build_info = true
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../../node_modules"]
