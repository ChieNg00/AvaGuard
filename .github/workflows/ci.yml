name: AvaGuard CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-checks:
    name: workspace-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install project pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  contracts-and-integration:
    name: contracts-and-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install project pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Check Solidity formatting
        working-directory: packages/contracts
        run: forge fmt --check

      - name: Build Solidity fixtures
        working-directory: packages/contracts
        run: forge build --build-info

      - name: Run Solidity tests
        working-directory: packages/contracts
        run: forge test -vv

      - name: Run Anvil integration tests
        run: pnpm test:integration

      - name: Run local browser acceptance
        run: |
          pnpm build
          pnpm --filter @avaguard/web exec playwright-core install --with-deps chromium
          pnpm test:browser
